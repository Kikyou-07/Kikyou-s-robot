<section class="provider-modal" id="usageModal" hidden aria-hidden="true">
  <div class="provider-dialog" style="width:min(880px,100%)" role="dialog" aria-modal="true" aria-labelledby="usageTitle" tabindex="-1">
    <header class="dialog-header"><h2 id="usageTitle">API 用量</h2><button class="icon-btn" aria-label="关闭 API 用量" onclick="closeModal('usageModal')">×</button></header>
    <label class="provider-field"><span>日期（北京时间）</span><input id="usageDay" type="date" onchange="loadUsage()"></label>
    <button onclick="loadUsage()">刷新用量</button>
    <p id="usageSummary" role="status">正在读取…</p>
    <p>统计本网页发起的聊天、重试与后台整理请求。本地模型不计入。未返回的用量显示“未知”，停止或断线也可能已经产生费用。</p>
    <p>费用按你填写的人民币单价重新估算，未包含缓存折扣、阶梯价、搜索等附加费用；以服务商账单为准。思考属于输出明细，不重复计费。</p>
    <div id="usageContent"></div>
    <h3>逐次请求（所选日期最近 100 条）</h3>
    <div style="overflow-x:auto"><table class="usage-table"><thead><tr><th>时间 / 用途</th><th>模型 / 状态</th><th>输入</th><th>输出</th><th>其中思考</th><th>估算</th></tr></thead><tbody id="usageRows"></tbody></table></div>
  </div>
</section>
